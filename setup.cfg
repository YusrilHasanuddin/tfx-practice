[flake8]
max-line-length = 100
ignore = D100,D103,D400,D401,D202
# You can also specify file-specific ignores:
per-file-ignores =
    political_bias_trainer.py:D100,D103,D400,D401,D202
    political_bias_tuner.py:D100,D103,D400,D401,D202
    main.py:D100,D103

[isort]
profile = black
multi_line_output = 3

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
